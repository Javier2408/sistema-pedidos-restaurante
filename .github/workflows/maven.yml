
name: CI - Sistema de Pedidos Restaurante

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: com.restaurante.sistemapedidos

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: com.restaurante.sistemapedidos/pom.xml

      - name: Compilar y ejecutar pruebas
        run: bash mvnw clean verify
